<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>로그인 - 시지중 마인크래프트</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    color: white;

    background:
        linear-gradient(
            rgba(4, 8, 12, .30),
            rgba(4, 8, 12, .54)
        ),
        url("./minecraft.png")
        center center /
        cover
        fixed;
}


/* =========================
   WRAPPER
========================= */

.login-wrap {
    width: 100%;
    max-width: 450px;

    padding: 20px;
}


/* =========================
   CARD
========================= */

.login-card {
    width: 100%;

    padding: 39px 40px 31px;

    background: rgba(29, 31, 34, .96);

    border-radius: 14px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.035);

    animation: show .25s ease;
}

@keyframes show {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   BRAND
========================= */

.brand {
    text-align: center;

    margin-bottom: 31px;
}

.brand-mark {
    width: 44px;
    height: 44px;

    margin: 0 auto 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: #267dd0;

    color: white;

    font-size: 22px;
    font-weight: 900;

    box-shadow:
        0 7px 25px rgba(38,125,208,.28);
}

.brand-name {
    margin-bottom: 24px;

    color: #dce8f3;

    font-size: 15px;
    font-weight: 600;
}

.brand h1 {
    margin: 0;

    font-size: 29px;
    letter-spacing: -1px;
}

.brand p {
    margin: 12px 0 0;

    color: #a8afb6;

    font-size: 13px;
}


/* =========================
   TABS
========================= */

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 6px;

    margin-bottom: 21px;
}

.tab {
    height: 42px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 5px;

    background: transparent;

    color: #aeb5bc;

    font-size: 13px;
}

.tab.active {
    color: white;

    background: #246cae;

    border-color: #388edc;
}


/* =========================
   INPUT
========================= */

.field {
    margin-bottom: 15px;
}

.field-label {
    display: block;

    margin-bottom: 7px;

    color: #b6bec6;

    font-size: 11px;
}

.field-input {
    width: 100%;
    height: 48px;

    padding: 0 13px;

    border:
        1px solid
        rgba(255,255,255,.27);

    border-radius: 4px;

    outline: none;

    background: #292b2e;
    color: white;

    font-size: 14px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.field-input::placeholder {
    color: #777f87;
}

.field-input:focus {
    border-color: #5eabec;

    box-shadow:
        0 0 0 1px #5eabec;
}


/* =========================
   SUBMIT
========================= */

.submit {
    width: 100%;
    height: 48px;

    margin-top: 5px;

    border: 0;
    border-radius: 4px;

    background: #246cae;
    color: white;

    font-size: 14px;
    font-weight: 700;

    transition:
        background .15s ease,
        transform .1s ease;
}

.submit:hover {
    background: #2d82cb;
}

.submit:active {
    transform: translateY(1px);
}

.submit:disabled {
    opacity: .55;
    cursor: wait;
}


/* =========================
   MESSAGE
========================= */

.message {
    min-height: 21px;

    margin-top: 14px;

    text-align: center;

    font-size: 12px;
    line-height: 1.6;
}

.message.error {
    color: #ff9a9a;
}

.message.success {
    color: #7fd0ff;
}


/* =========================
   BOTTOM
========================= */

.bottom {
    margin-top: 23px;
    padding-top: 18px;

    border-top:
        1px solid
        rgba(255,255,255,.09);

    text-align: center;
}

.bottom a {
    color: #9da7b0;

    font-size: 12px;
}

.bottom a:hover {
    color: #69b6ff;
}

.page-note {
    margin-top: 17px;

    text-align: center;

    color: rgba(255,255,255,.68);

    font-size: 11px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .login-wrap {
        padding: 13px;
    }

    .login-card {
        padding: 31px 24px 27px;
    }

    .brand h1 {
        font-size: 26px;
    }
}
</style>
</head>


<body>

<div class="login-wrap">

    <div class="login-card">

        <div class="brand">

            <div class="brand-mark">
                ◆
            </div>

            <div class="brand-name">
                시지중 마인크래프트
            </div>

            <h1 id="pageTitle">
                로그인
            </h1>

            <p id="pageDescription">
                시지중 마인크래프트 서버 이용
            </p>

        </div>


        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
            >
                로그인
            </button>

            <button
                id="signupTab"
                class="tab"
            >
                회원가입
            </button>

        </div>


        <form id="authForm">

            <div class="field">

                <label class="field-label">
                    이메일
                </label>

                <input
                    id="email"
                    class="field-input"
                    type="email"
                    placeholder="이메일을 입력하세요"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label class="field-label">
                    비밀번호
                </label>

                <input
                    id="password"
                    class="field-input"
                    type="password"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                id="submitBtn"
                class="submit"
                type="submit"
            >
                로그인
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="bottom">

            <a href="./index.html">
                ← 메인 페이지로 돌아가기
            </a>

        </div>

    </div>


    <div class="page-note">
        시지중학교 비공식 마인크래프트 서버
    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gpmnozujzhebnkpnrfik.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Df6zehKD_EARd9VnjMmtZw_GXvjE0uA";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DOM
========================================================= */

const authForm =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginTab =
    document.getElementById("loginTab");

const signupTab =
    document.getElementById("signupTab");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");

const pageTitle =
    document.getElementById("pageTitle");

const pageDescription =
    document.getElementById("pageDescription");


let mode = "login";


/* =========================================================
   MESSAGE
========================================================= */

function setMessage(
    text,
    type = "error"
) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================================
   MODE
========================================================= */

function setMode(newMode) {

    mode = newMode;

    setMessage("");

    if (mode === "login") {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        pageTitle.textContent =
            "로그인";

        pageDescription.textContent =
            "시지중 마인크래프트 서버 이용";

        submitBtn.textContent =
            "로그인";

        passwordInput.autocomplete =
            "current-password";

    } else {

        loginTab.classList.remove("active");
        signupTab.classList.add("active");

        pageTitle.textContent =
            "회원가입";

        pageDescription.textContent =
            "시지중 마인크래프트 서버 계정 만들기";

        submitBtn.textContent =
            "회원가입";

        passwordInput.autocomplete =
            "new-password";
    }
}


loginTab.addEventListener(
    "click",
    () => setMode("login")
);

signupTab.addEventListener(
    "click",
    () => setMode("signup")
);


/* =========================================================
   AUTH
========================================================= */

authForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            setMessage(
                "이메일과 비밀번호를 입력해주세요."
            );

            return;
        }


        submitBtn.disabled = true;

        setMessage(
            "처리 중입니다...",
            "success"
        );


        try {

            if (mode === "login") {

                const {
                    data,
                    error
                } =
                    await supabase.auth
                        .signInWithPassword({
                            email,
                            password
                        });


                if (error) {
                    throw error;
                }


                setMessage(
                    "로그인되었습니다.",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "./index.html";

                    },
                    500
                );


            } else {

                const {
                    data,
                    error
                } =
                    await supabase.auth
                        .signUp({
                            email,
                            password
                        });


                if (error) {
                    throw error;
                }


                /*
                   Supabase 설정에 따라
                   이메일 확인이 켜져 있으면
                   가입 후 이메일 인증이 필요함.
                */

                setMessage(
                    "회원가입이 완료되었습니다. 이메일 인증이 필요하면 메일을 확인해주세요.",
                    "success"
                );


                emailInput.value =
                    email;

                passwordInput.value =
                    "";

                setMode("login");

            }


        } catch (error) {

            console.error(
                "인증 오류:",
                error
            );


            const msg =
                error.message || "";


            if (
                msg.includes(
                    "Invalid login credentials"
                )
            ) {

                setMessage(
                    "이메일 또는 비밀번호가 올바르지 않습니다."
                );

            } else if (
                msg.toLowerCase().includes(
                    "already registered"
                )
            ) {

                setMessage(
                    "이미 가입된 이메일입니다."
                );

            } else if (
                msg.includes(
                    "Password should be at least"
                )
            ) {

                setMessage(
                    "비밀번호는 최소 6자 이상이어야 합니다."
                );

            } else {

                setMessage(
                    msg ||
                    "처리 중 오류가 발생했습니다."
                );
            }

        } finally {

            submitBtn.disabled = false;
        }

    }
);


/* =========================================================
   ALREADY LOGGED IN
========================================================= */

async function checkSession() {

    const {
        data,
        error
    } =
        await supabase.auth.getSession();


    if (error) {

        console.error(
            "세션 확인 실패:",
            error
        );

        return;
    }


    if (data.session?.user) {

        window.location.href =
            "./index.html";
    }
}


checkSession();

</script>

</body>
</html>
