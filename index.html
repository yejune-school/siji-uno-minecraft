<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gpmnozujzhebnkpnrfik.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Df6zehKD_EARd9VnjMmtZw_GXvjE0uA";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_UUID =
    "1cbc80a5-1c59-4696-b4ab-28ec455156f0";


/* =========================================================
   DOM
========================================================= */

const userNameEl =
    document.getElementById("userName");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const noticeList =
    document.getElementById("noticeList");

const adminPanel =
    document.getElementById("adminPanel");

const adminTitle =
    document.getElementById("adminTitle");

const noticeTitle =
    document.getElementById("noticeTitle");

const noticeContent =
    document.getElementById("noticeContent");

const saveNoticeBtn =
    document.getElementById("saveNoticeBtn");

const cancelEditBtn =
    document.getElementById("cancelEditBtn");

const copyBtn =
    document.getElementById("copyBtn");

const serverAddress =
    document.getElementById("serverAddress");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let isAdmin = false;
let editingNoticeId = null;


/* =========================================================
   XSS PROTECTION
========================================================= */

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DATE
========================================================= */

function formatDate(dateString) {
    if (!dateString) return "";

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}


/* =========================================================
   ADMIN CHECK
   - UI 표시용
   - 실제 CUD 권한은 Supabase RLS가 결정
========================================================= */

async function checkAdmin(user) {

    if (!user) {
        return false;
    }

    const {
        data,
        error
    } = await supabase
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {
        console.error(
            "관리자 확인 실패:",
            error
        );

        return false;
    }

    const result =
        !!data &&
        data.user_id === ADMIN_UUID;

    console.log(
        "is_admin ->",
        result
    );

    return result;
}


/* =========================================================
   LOAD ANNOUNCEMENTS
========================================================= */

async function loadAnnouncements() {

    noticeList.innerHTML = `
        <div class="empty-notice">
            공지사항을 불러오는 중입니다.
        </div>
    `;


    const {
        data,
        error
    } = await supabase
        .from("announcements")
        .select(
            "id,title,content,created_at,updated_at"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "공지사항 불러오기 실패:",
            error
        );

        noticeList.innerHTML = `
            <div class="empty-notice">
                공지사항을 불러오지 못했습니다.
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        noticeList.innerHTML = `
            <div class="empty-notice">
                현재 등록된 공지사항이 없습니다.
            </div>
        `;

        return;
    }


    noticeList.innerHTML =
        data.map(item => {

            const id =
                Number(item.id);

            const title =
                escapeHTML(item.title);

            const content =
                escapeHTML(item.content);

            const createdAt =
                escapeHTML(
                    formatDate(item.created_at)
                );

            const updated =
                item.updated_at &&
                item.updated_at !== item.created_at;


            const adminButtons =
                isAdmin
                    ? `
                        <div class="notice-actions">

                            <button
                                type="button"
                                class="notice-btn"
                                data-action="edit"
                                data-id="${id}"
                            >
                                수정
                            </button>

                            <button
                                type="button"
                                class="notice-btn notice-delete"
                                data-action="delete"
                                data-id="${id}"
                            >
                                삭제
                            </button>

                        </div>
                    `
                    : "";


            return `
                <article class="notice">

                    <h3 class="notice-title">
                        ${title}
                    </h3>

                    <p class="notice-content">
                        ${content}
                    </p>

                    <span class="notice-date">
                        ${createdAt}
                        ${updated ? " · 수정됨" : ""}
                    </span>

                    ${adminButtons}

                </article>
            `;

        }).join("");
}


/* =========================================================
   EVENT DELEGATION
========================================================= */

noticeList.addEventListener(
    "click",
    async function(event) {

        const button =
            event.target.closest(
                "button[data-action]"
            );

        if (!button) {
            return;
        }

        const action =
            button.dataset.action;

        const id =
            Number(button.dataset.id);

        if (!Number.isInteger(id)) {
            return;
        }

        if (action === "edit") {
            await editNotice(id);
        }

        if (action === "delete") {
            await deleteNotice(id);
        }
    }
);


/* =========================================================
   AUTH UI
========================================================= */

async function updateAuthUI(user) {

    currentUser = user;

    if (!user) {

        isAdmin = false;

        userNameEl.textContent = "";

        loginBtn.classList.remove(
            "hidden"
        );

        logoutBtn.classList.add(
            "hidden"
        );

        adminPanel.style.display =
            "none";

    } else {

        userNameEl.textContent =
            user.email?.split("@")[0] ||
            "사용자";

        loginBtn.classList.add(
            "hidden"
        );

        logoutBtn.classList.remove(
            "hidden"
        );


        isAdmin =
            await checkAdmin(user);


        adminPanel.style.display =
            isAdmin
                ? "block"
                : "none";
    }


    await loadAnnouncements();
}


/* =========================================================
   INITIAL SESSION
========================================================= */

async function initialize() {

    const {
        data,
        error
    } =
        await supabase.auth.getSession();


    if (error) {

        console.error(
            "세션 확인 실패:",
            error
        );

        await updateAuthUI(null);
        return;
    }


    await updateAuthUI(
        data.session?.user || null
    );
}


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
    function(event, session) {

        if (
            event === "INITIAL_SESSION" ||
            event === "SIGNED_IN" ||
            event === "SIGNED_OUT" ||
            event === "TOKEN_REFRESHED"
        ) {

            setTimeout(
                () => {
                    updateAuthUI(
                        session?.user || null
                    );
                },
                0
            );
        }
    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        logoutBtn.disabled = true;

        const {
            error
        } = await supabase.auth.signOut();


        logoutBtn.disabled = false;


        if (error) {

            console.error(
                "로그아웃 오류:",
                error
            );

            alert(
                "로그아웃에 실패했습니다."
            );

            return;
        }

        await updateAuthUI(null);
    }
);


/* =========================================================
   CREATE / UPDATE NOTICE
========================================================= */

saveNoticeBtn.addEventListener(
    "click",
    async function() {

        if (!currentUser || !isAdmin) {

            alert(
                "관리자만 사용할 수 있습니다."
            );

            return;
        }


        const title =
            noticeTitle.value.trim();

        const content =
            noticeContent.value.trim();


        if (!title || !content) {

            alert(
                "제목과 내용을 모두 입력해주세요."
            );

            return;
        }


        saveNoticeBtn.disabled = true;


        try {

            let result;


            if (editingNoticeId === null) {

                result =
                    await supabase
                        .from("announcements")
                        .insert({
                            title,
                            content
                        });

            } else {

                result =
                    await supabase
                        .from("announcements")
                        .update({
                            title,
                            content,
                            updated_at:
                                new Date()
                                    .toISOString()
                        })
                        .eq(
                            "id",
                            editingNoticeId
                        );
            }


            if (result.error) {
                throw result.error;
            }


            resetNoticeForm();

            await loadAnnouncements();


        } catch (error) {

            console.error(
                "공지 저장 실패:",
                error
            );

            alert(
                "공지 저장 실패\n\n" +
                error.message
            );

        } finally {

            saveNoticeBtn.disabled =
                false;
        }
    }
);


/* =========================================================
   EDIT NOTICE
========================================================= */

async function editNotice(id) {

    if (!isAdmin) {
        return;
    }


    const {
        data,
        error
    } =
        await supabase
            .from("announcements")
            .select(
                "id,title,content"
            )
            .eq("id", id)
            .maybeSingle();


    if (error || !data) {

        console.error(
            "공지 수정용 조회 실패:",
            error
        );

        alert(
            "공지사항을 불러오지 못했습니다."
        );

        return;
    }


    editingNoticeId = id;

    noticeTitle.value =
        data.title || "";

    noticeContent.value =
        data.content || "";


    adminTitle.textContent =
        "공지사항 수정";

    saveNoticeBtn.textContent =
        "공지 수정";

    cancelEditBtn.classList.remove(
        "hidden"
    );


    adminPanel.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


/* =========================================================
   RESET FORM
========================================================= */

function resetNoticeForm() {

    editingNoticeId = null;

    noticeTitle.value = "";
    noticeContent.value = "";

    adminTitle.textContent =
        "관리자 공지 작성";

    saveNoticeBtn.textContent =
        "공지 등록";

    cancelEditBtn.classList.add(
        "hidden"
    );
}


cancelEditBtn.addEventListener(
    "click",
    resetNoticeForm
);


/* =========================================================
   DELETE NOTICE
========================================================= */

async function deleteNotice(id) {

    if (!isAdmin) {
        return;
    }


    const confirmed =
        window.confirm(
            "이 공지사항을 삭제하시겠습니까?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } =
        await supabase
            .from("announcements")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(
            "공지 삭제 실패:",
            error
        );

        alert(
            "공지 삭제 실패\n\n" +
            error.message
        );

        return;
    }


    if (editingNoticeId === id) {
        resetNoticeForm();
    }


    await loadAnnouncements();
}


/* =========================================================
   COPY SERVER ADDRESS
========================================================= */

copyBtn.addEventListener(
    "click",
    async function() {

        const address =
            serverAddress.textContent.trim();


        try {

            await navigator.clipboard.writeText(
                address
            );


            const oldText =
                copyBtn.textContent;


            copyBtn.textContent =
                "복사 완료";


            setTimeout(
                function() {

                    copyBtn.textContent =
                        oldText;

                },
                1400
            );


        } catch (error) {

            alert(
                "복사에 실패했습니다.\n\n" +
                address
            );
        }
    }
);


/* =========================================================
   START
========================================================= */

initialize();

</script>
